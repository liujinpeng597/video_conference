# 持续集成: 每次 push / PR 都回答一个问题 —— "这套代码现在还能不能用"
#
#   test  : 用项目自己的测试入口 (和本地完全同一条命令):
#           两阶段构建镜像 -> 容器里编译 -> smoke.sh 全部断言 (含多实例互通)
#   image : 测试通过后, 构建运行镜像推到 ghcr, 以后部署就是 VPS 直接拉
#           (只在 push 时做; PR 和手动触发不推)
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 全链路测试
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      # compose 现在要求 POSTGRES_PASSWORD (fail-closed), CI 里用模板里的开发占位值
      - name: 准备 .env
        run: cp .env.example .env

      # 和本地同一条命令。db/redis 由 compose 起, smoke 会等它们健康后再跑。
      - name: 构建并跑 smoke 全链路
        run: docker compose run --build --rm test

      # 生产形态: 自签证书 + 80/443 + TLS + 限流, 一条链路整验
      - name: 生产形态 TLS 冒烟
        run: bash ops/smoke-tls.sh

      # 浏览器 E2E: 无头 Chrome 三个标签页进同一房间, 断言画面解码 + 双向 RTP (ops/e2e-media.mjs)
      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 起开发形态 (9000)
        run: docker compose up -d --build

      - name: 浏览器 E2E (音视频互通)
        run: node ops/e2e-media.mjs

      - name: 收开发形态
        if: always()
        run: docker compose down

      # 事件流端到端: Kafka(profile events) + 审计消费者 (ops/events-smoke.sh)
      - name: 事件流冒烟
        run: bash ops/events-smoke.sh

      # 告警闭环: Prometheus -> Alertmanager -> alert-sink, 灌一条合成告警断言送达 (ops/alert-drill.sh)
      - name: 告警闭环演练
        run: bash ops/alert-drill.sh

  image:
    name: 构建运行镜像
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main 分支推 :latest, 版本 tag (v0.1.0 这种) 就推同名镜像
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: video_server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 漏洞扫描: 先"只报告不拦截" (公共基础镜像的 CVE 噪音大, 看趋势再收紧)
      - name: 镜像漏洞扫描 (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '0'
