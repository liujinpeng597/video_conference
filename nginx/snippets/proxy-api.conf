# /api/* 的反向代理设置。被三处 location 共用: /api/ 前缀 + /api/login + /api/register。
#
# 上游组 "app_backend" 定义在两个 nginx*.conf 的 http 块里, 不用写死某个 IP:
# `server app:9000 resolve` 让 nginx 按 resolver 周期重新解析 Docker DNS,
# 实例增减、某台挂掉都能跟上 (要求 nginx ≥1.27.3; 旧版本不支持 upstream 里的
# resolve, 只能退回"变量 + resolver"的老写法 —— 代价是每请求新建后端连接)。
proxy_pass http://app_backend;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# 某台正在重启时自动换一台, 不要把这个错误直接丢给用户
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 3;
proxy_connect_timeout 2s;
proxy_read_timeout 30s;
