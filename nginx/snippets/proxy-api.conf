# /api/* 的反向代理设置。被三处 location 共用: /api/ 前缀 + /api/login + /api/register。
#
# 用"变量 + resolver"而不是 upstream: docker 里实例增减、换 IP 时 nginx 能跟上
# (upstream 只在启动时解析一次, 这是经典坑, 详见仓库 README)。
set $backend "http://app:9000";
proxy_pass $backend;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# 某台正在重启时自动换一台, 不要把这个错误直接丢给用户
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 3;
proxy_connect_timeout 2s;
proxy_read_timeout 30s;
