# 登录 / 注册两个接口: 精确匹配 (优先级高于 /api/ 前缀), 先限流再转发。
# 由 nginx.conf / nginx.tls.conf 的 server 块 include。
location = /api/login {
    limit_req zone=auth burst=10 nodelay;
    limit_conn perip 10;
    include /etc/nginx/snippets/proxy-api.conf;
}

location = /api/register {
    limit_req zone=auth burst=10 nodelay;
    limit_conn perip 10;
    include /etc/nginx/snippets/proxy-api.conf;
}

# 限流触发的 429 给一句能直接展示的中文, 而不是 nginx 默认的 HTML 错误页。
# 后端自己的 429 (按账号失败锁定) 不受影响: nginx 默认不拦截上游响应
# (proxy_intercept_errors 是 off), 所以那条 JSON 会原样透传。
error_page 429 = @too_many;
location @too_many {
    default_type "application/json; charset=utf-8";
    add_header Retry-After 60 always;
    return 429 '{"error":"操作太频繁，请稍后再试"}';
}
