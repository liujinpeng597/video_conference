# 登录 / 注册接口的按 IP 限流 (http 作用域, 由两个 nginx 配置 include)。
#
# 为什么要有: 防撞库; 同时保护后端 —— 每次密码校验跑 Argon2id, 固定吃 64MB 内存,
# 不限速的话一个脚本就能把进程的内存打满。
# 20 次/分钟 + burst 10: 正常用户输错几次完全无感, 脚本化的高频尝试会立刻撞墙。
# 按账号的失败锁定在后端 (handlers.cpp), 两层互补: 这层挡"换着账号撞",
# 那层挡"换着 IP 撞同一个账号"。
#
# 注意: nginx 前面再挂 CDN / 云 LB 时 $binary_remote_addr 会变成上一跳地址,
# 那时要用 real_ip 模块还原真实 IP, 否则所有用户共用一个限流额度。
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

# 同一 IP 的并发连接上限 (连出上百条连接的脚本在门口就被挡住)
limit_conn_zone $binary_remote_addr zone=perip:10m;

# 触发限流回 429 (默认 503 语义不对); JSON 响应体在 auth-endpoints.conf 里组装。
limit_req_status 429;
limit_conn_status 429;
