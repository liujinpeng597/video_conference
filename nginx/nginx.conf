# 入口层: 静态文件 + 反向代理到多个后端实例。
#
# 这里有个坑值得单独说: **upstream 不能写死**。`docker compose --scale app=3`
# 起多个实例时, 服务名 `app` 会解析出多个 IP, 但 nginx 只在启动时解析一次
# upstream 里写的名字, 于是三台实例只会用到一台。
#
# 所以用"变量 + resolver"的写法: proxy_pass 里带变量时, nginx 会走 resolver
# (Docker 内置 DNS 在 127.0.0.11) 按 valid 的周期重新解析域名, 实例增减、某台挂掉
# 都能跟上, 拿到的多个 IP 会轮着用。
#
# 另外说明一句: **nginx 开源版没有主动健康检查**, 那是 NGINX Plus 的功能。
# 这里靠 DNS 摘除 + proxy_next_upstream 近似: 实例挂了 DNS 会把它摘掉, 在摘掉之前
# 请求失败会自动重试下一台。生产上要真正的健康检查, 得用 Plus / HAProxy / 云 LB。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;

    # 日志里带上游地址: 反复请求 /api/health 就能看出请求分到了哪几台
    log_format main '$remote_addr [$time_local] "$request" $status '
                    '$body_bytes_sent upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # 本地演示关掉缓存方便改前端; 生产上这里应该交给 CDN 并设长缓存
    expires off;

    server {
        listen 80;
        server_name _;

        # 前端静态文件由 nginx 直接发, 不再落到后端。生产上这一步会换成 CDN。
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
            set $backend "http://app:9000";
            proxy_pass $backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 某台正在重启时自动换一台, 不要把这个错误直接丢给用户
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
        }

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-store";
        }
    }
}
