# 入口层: 静态文件 + 反向代理到多个后端实例。
#
# 这里有个坑值得单独说: **upstream 不能写死**。`docker compose --scale app=3`
# 起多个实例时, 服务名 `app` 会解析出多个 IP, 但 nginx 只在启动时解析一次
# upstream 里写的名字, 于是三台实例只会用到一台。
#
# 所以用"变量 + resolver"的写法: proxy_pass 里带变量时, nginx 会走 resolver
# (Docker 内置 DNS 在 127.0.0.11) 按 valid 的周期重新解析域名, 实例增减、某台挂掉
# 都能跟上, 拿到的多个 IP 会轮着用。
#
# 另外说明一句: **nginx 开源版没有主动健康检查**, 那是 NGINX Plus 的功能。
# 这里靠 DNS 摘除 + proxy_next_upstream 近似: 实例挂了 DNS 会把它摘掉, 在摘掉之前
# 请求失败会自动重试下一台。生产上要真正的健康检查, 得用 Plus / HAProxy / 云 LB。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;

    # 日志里带上游地址: 反复请求 /api/health 就能看出请求分到了哪几台
    log_format main '$remote_addr [$time_local] "$request" $status '
                    '$body_bytes_sent upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # 本地演示关掉缓存方便改前端; 生产上这里应该交给 CDN 并设长缓存
    expires off;

    charset utf-8;

    # 基础加固: 不吐版本号; 慢速请求超时压短; 请求体上限 1m
    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          15s;
    client_max_body_size  1m;
    reset_timedout_connection on;

    # 登录/注册的按 IP 限流区 (定义见 snippets/ratelimit-zones.conf)
    include /etc/nginx/snippets/ratelimit-zones.conf;

    server {
        listen 80;
        server_name _;

        # 前端静态文件由 nginx 直接发, 不再落到后端。生产上这一步会换成 CDN。
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # /api/* 的转发设置抽在 snippet 里, 和下面登录/注册两个"带限流"的精确匹配共用
        location /api/ {
            include /etc/nginx/snippets/proxy-api.conf;
        }

        # 登录 / 注册: 精确匹配优先于 /api/ 前缀, 在代理之前套一层按 IP 限流
        include /etc/nginx/snippets/auth-endpoints.conf;

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-store";
            # location 里写了 add_header 就不再继承 server 级的, 安全头要再写一遍
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }
    }
}
