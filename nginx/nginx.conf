# 入口层: 静态文件 + 反向代理到多个后端实例。
#
# 这里有个坑值得单独说: **upstream 里的名字默认只在启动时解析一次**。`docker compose
# --scale app=3` 起多个实例时, 服务名 `app` 会解析出多个 IP, 增减实例后老写法跟不上。
#
# 现在用的是 nginx 1.27.3+ 的 `upstream` + `server ... resolve;`: 按 resolver
# (Docker 内置 DNS 在 127.0.0.11) 的周期重新解析, 实例增减、某台挂掉都能跟上,
# 多个 IP 轮着用; 同时 `keepalive` 让到后端的连接复用 —— 压测里 nginx 的 CPU
# 大头就是每请求新建连接。(旧版本 nginx 不支持 upstream 里的 resolve, 要么升级,
# 要么退回"变量 + resolver"的写法, 见 snippets/proxy-api.conf 的头注释。)
#
# 另外说明一句: **nginx 开源版没有主动健康检查**, 那是 NGINX Plus 的功能。
# 这里靠 DNS 摘除 + proxy_next_upstream 近似: 实例挂了 DNS 会把它摘掉, 在摘掉之前
# 请求失败会自动重试下一台。生产上要真正的健康检查, 得用 Plus / HAProxy / 云 LB。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;

    # 日志里带上游地址: 反复请求 /api/health 就能看出请求分到了哪几台
    log_format main '$remote_addr [$time_local] "$request" $status '
                    '$body_bytes_sent upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    # app 的三个副本共用一个服务名; resolve = 按 resolver 周期重新解析 (要求 nginx ≥1.27.3),
    # keepalive 让到后端的连接复用 —— 压测里 nginx 的 CPU 大头就是每请求新建连接。
    upstream app_backend {
        zone app_backend 64k;
        server app:9000 resolve;
        keepalive 32;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # 本地演示关掉缓存方便改前端; 生产上这里应该交给 CDN 并设长缓存
    expires off;

    charset utf-8;

    # 基础加固: 不吐版本号; 慢速请求超时压短; 请求体上限 1m
    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          15s;
    client_max_body_size  1m;
    reset_timedout_connection on;

    # 登录/注册的按 IP 限流区 (定义见 snippets/ratelimit-zones.conf)
    include /etc/nginx/snippets/ratelimit-zones.conf;

    server {
        listen 80;
        server_name _;

        # 前端静态文件由 nginx 直接发, 不再落到后端。生产上这一步会换成 CDN。
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # /api/* 的转发设置抽在 snippet 里, 和下面登录/注册两个"带限流"的精确匹配共用
        location /api/ {
            include /etc/nginx/snippets/proxy-api.conf;
        }

        # 登录 / 注册: 精确匹配优先于 /api/ 前缀, 在代理之前套一层按 IP 限流
        include /etc/nginx/snippets/auth-endpoints.conf;

        # 静态资源缓存策略 (nginx.tls.conf 里要保持一致):
        #   index.html 永远 no-store, 部署立刻生效;
        #   app.css / app.js / vendor/*.js 缓存 1 小时 —— 无构建步骤就没有内容指纹,
        #   改这三个文件时把 index.html 里的 ?v=N 加一, 老用户下个页面就能拿到新的。
        location = /index.html {
            add_header Cache-Control "no-store" always;
            # location 里写了 add_header 就不再继承 server 级的, 安全头要再写一遍
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        location ~* \.(?:css|js)$ {
            add_header Cache-Control "public, max-age=3600" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        # 前端资源 (无构建步骤, 没有指纹文件名): 用 ?v=N 手动版本化, 这里给长缓存;
        # index.html 保持 no-store (见下面的 location /), 改前端后给它加 ?v=N 再发。
        location ~* ^/(app\.(css|js)|vendor/) {
            root /usr/share/nginx/html;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-store";
            # location 里写了 add_header 就不再继承 server 级的, 安全头要再写一遍
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }
    }
}
