# 生产形态的入口层: TLS 终止 + 80→443 跳转 + 和开发配置完全相同的反代/限流行为。
#
# 由 docker-compose.prod.yml 覆盖挂载成 /etc/nginx/nginx.conf。
# 证书放 nginx/certs/ (bash ops/gen-cert.sh 生成, 或换成真实证书)。
#
# 和 nginx.conf (开发配置) 的关系: 代理设置、限流区都在 snippets/ 里共享,
# 两个文件的差异只有"监听什么端口 + 是否终止 TLS"。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    sendfile      on;
    tcp_nopush    on;

    log_format main '$remote_addr [$time_local] "$request" $status '
                    '$body_bytes_sent upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    expires off;

    # 基础加固: 不吐版本号; 慢速请求超时压短; 请求体上限 1m
    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          15s;
    client_max_body_size  1m;
    reset_timedout_connection on;

    # 登录/注册的按 IP 限流区 (和开发配置共用同一份定义)
    include /etc/nginx/snippets/ratelimit-zones.conf;

    # 80: 只做两件事 —— 给证书签发流程留验证目录 + 其它请求全部跳到 https
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;

        # 一年内强制 https。自签阶段先按 nginx/README.md 把根证书装进信任列表再访问;
        # 想清掉浏览器里的记录: chrome://net-internals/#hsts → Delete domain security policies。
        add_header Strict-Transport-Security "max-age=31536000" always;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # /api/* 的转发配置在 snippet 里, 登录/注册两个精确匹配外加限流, 三处共用同一份设置
        location /api/ {
            include /etc/nginx/snippets/proxy-api.conf;
        }

        include /etc/nginx/snippets/auth-endpoints.conf;

        # 静态资源缓存策略 (和开发配置 nginx.conf 保持一致, 另加 HSTS):
        #   index.html 永远 no-store; app.css / app.js / vendor/*.js 缓存 1 小时,
        #   改文件时把 index.html 里的 ?v=N 加一 (无构建步骤的轻量缓存方案)。
        location = /index.html {
            add_header Cache-Control "no-store" always;
            # 在 location 里写 add_header 会覆盖 server 级的, 所以这里把 HSTS 和安全头都带上
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        location ~* \.(?:css|js)$ {
            add_header Cache-Control "public, max-age=3600" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        # 前端资源 (无构建步骤, 没有指纹文件名): 用 ?v=N 手动版本化, 这里给长缓存;
        # index.html 保持 no-store (见下面的 location /), 改前端后给它加 ?v=N 再发。
        location ~* ^/(app\.(css|js)|vendor/) {
            root /usr/share/nginx/html;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-store";
            # location 里写了 add_header 就不再继承 server 级的, 安全头要再写一遍
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header Strict-Transport-Security "max-age=31536000" always;
        }
    }
}
