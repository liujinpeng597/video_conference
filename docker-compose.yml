# 视频会议的部署编排。
#
#   第一次跑之前: cp .env.example .env, 把 POSTGRES_PASSWORD 填上。
#   没填的话 compose 会直接拒绝启动 (fail-closed, 这是有意的)。
#
#   docker compose up -d --build
#     起来之后: PostgreSQL + Redis + 3 个后端实例 + nginx。
#     浏览器开 http://127.0.0.1:9000 (走 nginx, 不是直连某一台后端)。
#     反复刷新或请求 /api/health, 返回里的 instance 会在几台之间变。
#
#   docker compose run --rm test
#     跑全链路测试 (复用编译阶段镜像, 本地不用装任何依赖)
#
#   docker compose up -d db redis
#     只起中间件 (口令和本地连接串一致, 见 .env), 然后在 WSL 里跑本地编译的二进制:
#       cd video_server && ./video_server --db ... --redis redis://127.0.0.1:6379
#
# 关于"多个服务器": 这里用同一台机器上的多个容器模拟。每个 app 容器是一个独立进程、
# 独立的 TCP 端口、独立的内存, 互相之间只有 Redis 和 PostgreSQL 两条线。
# 把它们换到三台真机器上, 除了连接串改成真实地址以外, 代码一行都不用动。

# 所有服务共用一条日志轮转设置: 不设的话 json-file 日志会一直涨, 几个月把磁盘写满。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    # 拉不动 Docker Hub 的话, 在 .env 里把镜像名指到镜像站 (见 .env.example)
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_USER: video
      # 口令从 .env 读; 没设置就拒绝启动, 防止把弱口令带上生产
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?没设置 POSTGRES_PASSWORD, 先 cp .env.example .env 并填一个密码}
      POSTGRES_DB: video_conference
    ports:
      # 只绑回环: 给本机调试用, 公网访问不到。
      # 别写成 "5432:5432" —— Docker 发布端口会绕过 ufw, 等于裸奔。
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video -d video_conference"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  # 房间在线状态和信令收件箱放这里, 所以后端实例才是无状态的。
  # 故意不开持久化: 这些数据本来就是易失的, Redis 挂了重建即可, 不需要 AOF/RDB。
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"   # 只绑回环, 理由同上
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  # TURN 中继: 对称 NAT / 企业网下直连建不起来时的兜底 (约一到两成用户需要)。
  # 后端按 TURN REST 规范签发临时凭证 (见 handlers.cpp 的 apiIce), 不用固定用户名密码。
  # 本机开发时它就是闲着的; 对外部署时把 TURN_URL 指到这台机器的公网地址即可。
  # 注意: 中继端口只开了 41 个, 并发通话量大了要跟着调大。
  coturn:
    build:
      context: ./coturn
    command:
      - "-n"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET:?没设置 TURN_SECRET, 先 cp .env.example .env 并填一个密码}"
      - "--realm=video-conference"
      - "--fingerprint"
      - "--no-tls"
      - "--no-dtls"
      - "--no-multicast-peers"
      # 拒绝把中继打到私有地址段/回环, 防止被当成内网跳板 (局域网内通话走直连, 不受影响)
      - "--denied-peer-ip=127.0.0.0-127.255.255.255"
      - "--denied-peer-ip=10.0.0.0-10.255.255.255"
      - "--denied-peer-ip=172.16.0.0-172.31.255.255"
      - "--denied-peer-ip=192.168.0.0-192.168.255.255"
      - "--listening-port=3478"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--pidfile=/tmp/turnserver.pid"
      - "--log-file=stdout"
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    healthcheck:
      # STUN 绑定能通 = 中继真的在监听 (镜像里自带 turnutils_stunclient)
      test: ["CMD", "turnutils_stunclient", "-p", "3478", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: video_server/Dockerfile
    # 每个副本的 worker 线程数: 默认 0 = 自动取核数。小机器上 3 副本 × 核数 会互相超卖,
    # 用 APP_WORKERS=1~2 收窄 (连接数公式见 DEPLOY.md「容量参数」)。
    command: ["./video_server", "--port", "9000", "--workers", "${APP_WORKERS:-0}", "--web", "video_client", "--migrations", "migrations"]
    environment:
      DATABASE_URL: postgresql://video:${POSTGRES_PASSWORD:?没设置 POSTGRES_PASSWORD, 先 cp .env.example .env 并填一个密码}@db:5432/video_conference
      REDIS_URL: redis://redis:6379
      # TURN: TURN_URL 留空 = 不下发 TURN (本机/局域网够用);
      # 对外部署时填 turn:<公网 IP 或域名>:3478, 后端按用户签发 12 小时临时凭证
      TURN_SECRET: ${TURN_SECRET:?没设置 TURN_SECRET, 先 cp .env.example .env 并填一个密码}
      TURN_URL: ${TURN_URL:-}
      # 事件流 (可选): 配了才有事件; Kafka 挂了事件会丢, 但业务完全不受影响
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-meeting.events}
      TURN_TTL_SECONDS: ${TURN_TTL_SECONDS:-}
      # 交给浏览器的 ICE 服务器列表。默认只有一个公共 STUN, 本机和局域网够用;
      # 对外提供服务时把 TURN 加进来 (见 video_server/README.md「信令和媒体」):
      # ICE_SERVERS: '[{"urls":"stun:stun.example.com:3478"},{"urls":"turn:turn.example.com:3478","username":"u","credential":"p"}]'
    # 刻意不发布端口: 唯一入口是 nginx, 这就是生产上的样子。
    # 想单独进某一台看看: docker compose exec app bash
    deploy:
      replicas: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 这个接口会同时查 PostgreSQL 和 Redis, 所以它能真的说明这台能不能干活
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  # 入口层: 静态文件 + 反向代理。生产上这一层通常还会终止 TLS、挂 WAF。
  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    ports:
      - "9000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./video_client:/usr/share/nginx/html:ro
    depends_on:
      - app
    restart: unless-stopped
    logging: *default-logging

  # 测试服务: 直接复用编译阶段的镜像, 里面有编译器 / libpq-dev / libsodium-dev /
  # libhiredis-dev 和源码, 所以本地什么都不用装也能跑测试。
  # 测试用同一个库但用户名带时间戳, 可以反复跑。
  test:
    build:
      context: .
      dockerfile: video_server/Dockerfile
      target: build
    working_dir: /src/video_server
    environment:
      TEST_DB: postgresql://video:${POSTGRES_PASSWORD:?没设置 POSTGRES_PASSWORD, 先 cp .env.example .env 并填一个密码}@db:5432/video_conference
      TEST_REDIS: redis://redis:6379
      # TURN 断言用: 固定指向 compose 网络里的 coturn, 不取 .env 的 TURN_URL,
      # 这样不管本机 .env 怎么配, 测试结果都可复现。
      TURN_URL: turn:coturn:3478
      TURN_SECRET: ${TURN_SECRET:?没设置 TURN_SECRET, 先 cp .env.example .env 并填一个密码}
    command: bash test/smoke.sh
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      coturn:
        condition: service_healthy
    profiles: ["test"]

  # 备份 / 恢复演练: 一次性任务, 不参与常态 up (它在 ops profile 里)。
  #
  #   docker compose run --rm backup                              # 备份一次 -> ./backups/
  #   docker compose run --rm backup /ops/restore-drill.sh        # 恢复演练 (不动正在用的库)
  #   docker compose run --rm backup /ops/restore.sh <备份文件>    # 恢复到新库, 再做切换
  #
  # 为什么不写宿主机脚本: pg_dump 的二进制输出经 PowerShell 管道会被文本编码弄坏;
  # 放进容器直接写挂载卷, 在 Windows / Linux / CI 上结果一致。
  # 备份策略 (RPO/RTO) 和定时任务示例见 ops/README.md。
  backup:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    profiles: ["ops"]
    entrypoint: ["/bin/sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?没设置 POSTGRES_PASSWORD, 先 cp .env.example .env 并填一个密码}
    volumes:
      - ./backups:/backups
      - ./ops:/ops:ro
    command: ["/ops/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging

  # 可观测性 (可选): docker compose --profile monitoring up -d
  #   Prometheus: http://127.0.0.1:9090    Grafana: http://127.0.0.1:3001 (admin/<GRAFANA_ADMIN_PASSWORD>)
  # 都只绑回环; 指标来源是每个 app 实例的 /metrics (见 video_server/README.md「可观测性」)。
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.1.0}
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.4.0}
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
    logging: *default-logging

  # 告警闭环: Prometheus 触发规则 -> Alertmanager 分组/路由 -> 通知渠道。
  # 本机默认渠道是 alert-sink (收到就打印), 不需要任何云服务就能把链路跑通并可测。
  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.28.1}
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped
    logging: *default-logging

  # 告警的本机终点: 收到 webhook 就打印。看: docker compose logs -f alert-sink
  # 生产把这个 URL 换成真通知渠道 (钉钉/飞书/Slack) 即可, 规则和路由都不用改。
  alert-sink:
    image: ${ALERT_SINK_IMAGE:-python:3.12-alpine}
    profiles: ["monitoring"]
    command: ["python", "/sink/alert-sink.py", "8080"]
    volumes:
      - ./monitoring:/sink:ro
    ports:
      - "127.0.0.1:9099:8080"   # 只绑回环, 方便本机 curl 自查
    restart: unless-stopped
    logging: *default-logging

  # 事件流 (可选): docker compose --profile events up -d
  #   Kafka (KRaft 单节点) + 审计消费者 event_consumer (源代码在 video_server/consumer/)。
  #   应用侧 KAFKA_BROKERS 不配就是关闭; 事件是尽力而为的审计/统计流 (见 events.h)。
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.1}
    profiles: ["events"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafkadata:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9092:9092"   # 只绑回环: 本机调试用
    restart: unless-stopped
    logging: *default-logging

  events:
    build:
      context: .
      dockerfile: video_server/Dockerfile
    profiles: ["events"]
    command: ["./event_consumer"]
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-meeting.events}
    volumes:
      - eventdata:/data
    depends_on:
      - kafka
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata:
  promdata:
  grafanadata:
  kafkadata:
  eventdata:
