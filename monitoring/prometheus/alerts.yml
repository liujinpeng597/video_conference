# 告警规则。触发后交给 Alertmanager 路由/分组/抑制, 再送到通知渠道
# (monitoring/alertmanager/alertmanager.yml)。本机默认的渠道是 alert-sink
# 那个打印容器; 闭环演练见 ops/alert-drill.sh。
groups:
  - name: video-conference
    rules:
      - alert: InstanceDown
        expr: up{job="video_server"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "有后端实例抓不到指标了 (挂了或网络断了)"
          description: "{{ $labels.instance }} 已经 1 分钟 up==0"

      - alert: HighErrorRate
        expr: |
          sum(rate(video_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(video_requests_total[5m])), 0.001) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "5xx 比例超过 1%"
          description: "最近 5 分钟 5xx 占比 {{ $value | humanizePercentage }}"

      - alert: RedisErrors
        expr: increase(video_redis_errors_total[5m]) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Redis 错误在增长 (房间状态/信令会受影响)"

      - alert: DbErrors
        expr: increase(video_db_errors_total[5m]) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL 错误在增长 (登录/会话会受影响)"

      # p95 延迟: 轮询模型下正常在 1~2ms 量级 (见 ops/loadtest), 500ms 是很宽松的线,
      # 越过基本意味着依赖 (PG/Redis) 或者线程池出问题了。
      - alert: HighP95Latency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(video_request_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "接口 p95 延迟超过 500ms"
          description: "最近 5 分钟 p95 延迟 {{ $value }}s"
